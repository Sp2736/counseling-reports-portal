<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Counseling Reports Portal banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1f3a"/><stop offset="0.6" stop-color="#0f3a5f"/><stop offset="1" stop-color="#0e5a63"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e0f2fe"/><stop offset="0.5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.07"/></pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- calm pulse line -->
    <path d="M0 255 H260 L290 255 L310 215 L335 285 L360 235 L380 255 H640 L670 255 L690 225 L715 280 L740 240 L760 255 H1200" fill="none" stroke="#5eead4" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1500" stroke-dashoffset="1500">
      <animate attributeName="stroke-dashoffset" from="1500" to="0" dur="5s" repeatCount="indefinite"/>
    </path>

    <text x="600" y="118" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="1" fill="url(#title)">Counseling Reports Portal<animate attributeName="opacity" values="0.93;1;0.93" dur="4s" repeatCount="indefinite"/></text>
    <text x="600" y="164" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#bae6fd" letter-spacing="3">SWOT SUBMISSIONS · AI-DRAFTED REPORTS · COUNSELOR-DECIDED OUTCOMES</text>
    <g font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="14" font-weight="700" text-anchor="middle">
      <rect x="388" y="190" width="124" height="32" rx="16" fill="#0b1f3a" stroke="#7dd3fc" stroke-opacity="0.7"/><text x="450" y="211" fill="#7dd3fc">STUDENT</text>
      <rect x="528" y="190" width="144" height="32" rx="16" fill="#0b1f3a" stroke="#5eead4" stroke-opacity="0.7"/><text x="600" y="211" fill="#5eead4">COUNSELOR</text>
      <rect x="688" y="190" width="124" height="32" rx="16" fill="#0b1f3a" stroke="#fcd34d" stroke-opacity="0.7"/><text x="750" y="211" fill="#fcd34d">ADMIN</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#38bdf8" stroke-opacity="0.4"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
