<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Lifecycle of a counseling report" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1b30"/><stop offset="1" stop-color="#0a1626"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <clipPath id="clip"><rect width="1200" height="430" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <text x="40" y="42" font-size="13" font-weight="700" letter-spacing="2" fill="#7dd3fc">FROM SUBMISSION TO SIGNED-OFF REPORT</text>
    <text x="40" y="62" font-size="12" fill="#94a3b8">The AI only drafts. A report becomes final only when a counselor reviews it.</text>

    <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M215 150H265"/><path d="M445 150H495"/><path d="M675 150H725"/><path d="M905 150H955"/>
      <path d="M355 185V262"/><path d="M1045 185V262"/>
    </g>
    <circle r="6" fill="#7dd3fc"><animateMotion dur="8s" repeatCount="indefinite" path="M40 150H1160"/></circle>
    <circle r="6" fill="#5eead4"><animateMotion dur="8s" begin="4s" repeatCount="indefinite" path="M40 150H1160"/></circle>

    <g font-weight="700" text-anchor="middle">
      <rect x="40" y="115" width="175" height="70" rx="12" fill="#0f2a44" stroke="#7dd3fc"/>
      <text x="127" y="146" font-size="15" fill="#e0f2fe">Student submits</text><text x="127" y="167" font-size="12" font-weight="400" fill="#7dd3fc">SWOT + semester</text>

      <rect x="265" y="115" width="180" height="70" rx="12" fill="#2a2208" stroke="#fbbf24"/>
      <text x="355" y="146" font-size="15" fill="#fef3c7">Pending_AI</text><text x="355" y="167" font-size="12" font-weight="400" fill="#fcd34d">queued, nothing blocks</text>

      <rect x="495" y="115" width="180" height="70" rx="12" fill="#241a3d" stroke="#a78bfa"/>
      <text x="585" y="146" font-size="15" fill="#ede9fe">Scheduled drafting</text><text x="585" y="167" font-size="12" font-weight="400" fill="#c4b5fd">every 30 min · ≤10 records</text>

      <rect x="725" y="115" width="180" height="70" rx="12" fill="#0b2e2c" stroke="#5eead4"/>
      <text x="815" y="146" font-size="15" fill="#ccfbf1">Needs_Review</text><text x="815" y="167" font-size="12" font-weight="400" fill="#5eead4">AI draft ready</text>

      <rect x="955" y="115" width="205" height="70" rx="12" fill="#0b2e1f" stroke="#34d399" stroke-width="2.5"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></rect>
      <text x="1057" y="146" font-size="15" fill="#d1fae5">Reviewed_Completed</text><text x="1057" y="167" font-size="12" font-weight="400" fill="#6ee7b7">counselor's final decision</text>

      <rect x="265" y="262" width="180" height="62" rx="12" fill="#1f2937" stroke="#94a3b8" stroke-dasharray="5 4"/>
      <text x="355" y="288" font-size="14" fill="#e5e7eb">Cancelled_By_Student</text><text x="355" y="308" font-size="12" font-weight="400" fill="#9ca3af">student withdraws</text>

      <rect x="955" y="262" width="205" height="62" rx="12" fill="#0f2a44" stroke="#7dd3fc"/>
      <text x="1057" y="288" font-size="14" fill="#e0f2fe">Printable report</text><text x="1057" y="308" font-size="12" font-weight="400" fill="#7dd3fc">institution-branded</text>
    </g>

    <text x="585" y="236" text-anchor="middle" font-size="12" fill="#94a3b8">If the AI call fails or returns malformed output,</text>
    <text x="585" y="254" text-anchor="middle" font-size="12" fill="#94a3b8">the record stays queued and is retried on the next run.</text>
    <path d="M585 190V215" stroke="#475569" stroke-width="2" stroke-dasharray="4 5" fill="none"/>
    <text x="40" y="372" font-size="12" fill="#94a3b8">A counselor can also reject a submission with a reason (Cancelled_By_Counselor), which the student can see.</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="429" rx="16" fill="none" stroke="#1e3a5f"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
