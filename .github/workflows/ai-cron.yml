name: AI Background Processor

on:
  schedule:
    # Runs at minute 0 and 30 past every hour (e.g., 10:00, 10:30, 11:00...)
    - cron: '0,30 * * * *'
  # This line adds a button in GitHub so you can test it manually without waiting 30 mins
  workflow_dispatch: 

jobs:
  trigger-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Next.js API
        env:
          # Both values live in GitHub repository secrets, never in the code
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          curl -X GET "$APP_URL/api/cron/process-ai" \
          -H "Authorization: Bearer $CRON_SECRET" \
          --fail